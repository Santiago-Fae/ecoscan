services:
  ecoscan:
    build:
      context: .
      args:
        # Lighter alternative: ViT-B/16 (less memory/CPU, slightly lower confidence)
        CLIP_MODEL: ${CLIP_MODEL:-ViT-L/14}
    image: ecoscan:latest
    container_name: ecoscan
    ports:
      - "8000:8000"
    environment:
      CLIP_MODEL: ${CLIP_MODEL:-ViT-L/14}
      YOLO_CONF: ${YOLO_CONF:-0.25}
      MIN_MATERIAL_PROB: ${MIN_MATERIAL_PROB:-0.45}
    volumes:
      - ecoscan-data:/data   # SQLite statistics survive container restarts
    restart: unless-stopped

volumes:
  ecoscan-data:
